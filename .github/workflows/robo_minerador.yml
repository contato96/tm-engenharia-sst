name: Executar Robô Minerador SST 24h

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  varredura-pncp:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v3

      - name: 2. Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai pandas

      - name: 4. Executar Robô Scraper + IA Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python robo_licitacoes_sjc.py

      - name: 5. Atualizar licitacoes.json e sincronizar Vercel
        run: |
          git config --global user.name 'Robo-TM-Engenharia'
          git config --global user.email 'robo@tmengenharia.com'
          git add licitacoes.json
          git commit -m "Auto-update: Licitações Filé Mignon atualizadas [skip ci]" || exit 0
          git push
